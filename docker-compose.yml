# no "version" key

x-common-env: &common_env
# Load environment variables from .env in the project root
  env_file:
    - .env

  # Allow containers to reach services on the host via this hostname
  extra_hosts:
    - "host.docker.internal:host-gateway"

  # Runtime env vars
  environment:
    # Don't write into root's $HOME inside the image; use a tmp home
    HOME: /tmp

    # Keep npm's cache ephemeral (avoids permission issues on bind mounts)
    NPM_CONFIG_CACHE: /tmp/.npm

x-common-mounts: &common_mounts
  working_dir: /workspace
  volumes:
  # --- Bind mounts (host paths must exist) ---

    # 1) Project source → live edit on host reflects in container.
    #    node_modules is IN-TREE (installed by build.sh as the host user), so
    #    it rides along in this mount — the shared
    #    /opt/resources/node_mod_cache mount is retired (2026-08-26); each
    #    copy (dev clone, release) owns its own deps.
    - ./:/workspace

    # 2) Centralized run logs on host
    - /opt/run-logs/reports:/opt/run-logs/reports

    # 3) Shared PG SSL cert (read-only) — required by PG_SSLMODE=verify-full
    - /opt/resources/ssl:/opt/resources/ssl:ro

# ---------- Services ----------
services:
  app:
    # USER_ID drives the tag: reports:<username> for dev builds, reports:svc
    # for the release copy (flipped by #RELEASE:USER_ID=svc at release time).
    # Renamed from the historical shared `aux:` tag 2026-08-26 -- nothing
    # else consumes aux:. Build with: bash build.sh
    image: reports:${USER_ID}
    build:
      context: .
      # Host identity comes from .env so this file stays host-agnostic and the
      # dev and staging branches can share it. See .env.example.
      args:
        USER_ID: ${USER_ID}
        DOCKER_GID: ${DOCKER_GID}
        UID_0: ${UID_0}
        UID_1: ${UID_1}
        UID_2: ${UID_2}
    <<: [*common_env, *common_mounts]
    environment:
      # Intentionally unset in .env: empty -> entrypoint.sh defaults to svc,
      # so ONE place decides the production identity. Dev runs pass it on the
      # command line. ':-' silences the compose WARN.
      RUN_USER: ${RUN_USER:-}
      HOME: /tmp
      NPM_CONFIG_CACHE: /tmp/.npm
      # Local PG container overrides
      PGHOST: pg_db
      PGPORT: "5432"
      # verify-full: CA-verified TLS with hostname check (cert SAN covers pg_db).
      # pg-pool.js fails closed if the CA at PG_SSL_PATH is missing.
      PG_SSLMODE: verify-full
      PG_SSL_PATH: /opt/resources/ssl/pg_ssl.crt
    networks:
      - pg_net

# Declare external networks
networks:
  pg_net:
    external: true
