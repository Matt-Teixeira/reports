# no "version" key

x-common-env: &common_env
# Load environment variables from .env in the project root
  env_file:
    - .env

  # Allow containers to reach services on the host via this hostname
  extra_hosts:
    - "host.docker.internal:host-gateway"

  # Runtime env vars
  environment:
    # Don't write into root's $HOME inside the image; use a tmp home
    HOME: /tmp

    # Keep npm's cache ephemeral (avoids permission issues on bind mounts)
    NPM_CONFIG_CACHE: /tmp/.npm

x-common-mounts: &common_mounts
  working_dir: /workspace
  volumes:
  # --- Bind mounts (host paths must exist) ---

    # 1) Project source → live edit on host reflects in container
    - ./:/workspace

    # 2) Cache node_modules on host (survives container removal)
    - /opt/resources/node_mod_cache/reports:/workspace/node_modules

    # 3) Centralized run logs on host
    - /opt/run-logs/reports:/opt/run-logs/reports

    # 4) Shared PG SSL cert (read-only) — required by PG_SSLMODE=verify-full
    - /opt/resources/ssl:/opt/resources/ssl:ro

# ---------- Services ----------
services:
  app:
    # This repo OWNS the shared `aux` image. It was previously built by hand
    # and had no build stanza here, which is why a fresh host had no way to
    # produce it. Build with: docker compose build app
    image: aux:${IMAGE_TAG}
    build:
      context: .
      # Host identity comes from .env so this file stays host-agnostic and the
      # dev and staging branches can share it. See .env.example.
      args:
        DOCKER_GID: ${DOCKER_GID}
        UID_0: ${UID_0}
        UID_1: ${UID_1}
        UID_2: ${UID_2}
    <<: [*common_env, *common_mounts]
    environment:
      RUN_USER: ${RUN_USER:-svc}
      HOME: /tmp
      NPM_CONFIG_CACHE: /tmp/.npm
      # Local PG container overrides
      PGHOST: pg_db
      PGPORT: "5432"
      # verify-full: CA-verified TLS with hostname check (cert SAN covers pg_db).
      # pg-pool.js fails closed if the CA at PG_SSL_PATH is missing.
      PG_SSLMODE: verify-full
      PG_SSL_PATH: /opt/resources/ssl/pg_ssl.crt
    networks:
      - pg_net

# Declare external networks
networks:
  pg_net:
    external: true
